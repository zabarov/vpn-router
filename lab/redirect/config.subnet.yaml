schema_version: "3.0"

routing_data:
  country_provider: { type: ripestat, refresh_interval: 24h, max_stale: 7d }
  domain_resolver: { refresh_interval: 5m, min_ttl: 60, max_ttl: 3600, max_stale: 24h }

sources:
  - tag: lab-source
    type: tunnel_interface
    namespace: host
    interface: awg0
    clients:
      mode: subnet
      subnet: 10.8.1.0/24

capture:
  type: redirect
  listen_port: 12345

egresses:
  - tag: direct
    type: direct
  - tag: strict-egress
    type: socks5
    server: socks-egress
    port: 1080
    healthcheck_url: https://example.com/

policies:
  - tag: direct-override
    sources: [lab-source]
    destination_sets: [direct-target]
    egress: direct
    failure_mode: direct
  - tag: strict
    sources: [lab-source]
    destination_sets: [strict-target]
    egress: strict-egress
    failure_mode: block
  - tag: default
    sources: [lab-source]
    destination_sets: [default]
    egress: direct
    failure_mode: direct

destination_sets:
  strict-target:
    country_codes: [RU]
    exact_domains: [strict.test]
    domain_suffixes: [.test]
    ip_cidrs: []
  direct-target:
    exact_domains: []
    ip_cidrs: [198.18.20.30/32]

traffic_handling:
  udp_quic: reject
  ipv6: reject
  dns_mode: managed

resources:
  nftables_table: vpn_router_lab
  service_name: vpn-router-lab

schema_version: "1.0"

sources:
  - tag: lab-source
    type: linux_interface
    interface: awg0
    client_scope:
      mode: subnet
      subnet: 10.8.1.0/24

capture:
  type: redirect
  listen_port: 12345

egresses:
  - tag: direct
    type: direct
  - tag: strict-egress
    type: socks5
    server: socks-egress
    port: 1080
    healthcheck_url: https://example.com/

policies:
  - tag: strict
    source: lab-source
    destination_sets: [strict-target]
    egress: strict-egress
    failure_mode: block
  - tag: default
    source: lab-source
    destination_sets: [default]
    egress: direct
    failure_mode: direct

destination_sets:
  strict-target:
    domain_suffixes: [.test]

traffic_handling:
  udp_quic: reject
  ipv6: reject
  dns_mode: managed

resources:
  nftables_table: vpn_router_lab
  service_name: vpn-router-lab

name: vpn-router-redirect-lab

services:
  source:
    image: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
    privileged: true
    command:
      - /bin/sh
      - -ec
      - |
        apk add --no-cache busybox-extras iproute2 nftables
        ip netns add vpn-switch
        ip netns add canary-client
        ip netns add control-client
        ip link add awg0 type veth peer name uplink0
        ip link set uplink0 netns vpn-switch
        ip addr add 10.8.1.1/24 dev awg0
        ip link set awg0 up
        ip netns exec vpn-switch ip link add br0 type bridge
        ip netns exec vpn-switch ip link set br0 up
        ip netns exec vpn-switch ip link set uplink0 master br0
        ip netns exec vpn-switch ip link set uplink0 up
        ip link add canary-switch type veth peer name canary0
        ip link set canary-switch netns vpn-switch
        ip link set canary0 netns canary-client
        ip netns exec vpn-switch ip link set canary-switch master br0
        ip netns exec vpn-switch ip link set canary-switch up
        ip link add control-switch type veth peer name control0
        ip link set control-switch netns vpn-switch
        ip link set control0 netns control-client
        ip netns exec vpn-switch ip link set control-switch master br0
        ip netns exec vpn-switch ip link set control-switch up
        ip netns exec canary-client ip link set lo up
        ip netns exec canary-client ip addr add 10.8.1.2/24 dev canary0
        ip netns exec canary-client ip link set canary0 up
        ip netns exec canary-client ip route add default via 10.8.1.1
        ip netns exec control-client ip link set lo up
        ip netns exec control-client ip addr add 10.8.1.3/24 dev control0
        ip netns exec control-client ip link set control0 up
        ip netns exec control-client ip route add default via 10.8.1.1
        sysctl -w net.ipv4.ip_forward=1 >/dev/null
        nft -f /etc/vpn-router/base-nat.nft
        nft -f /etc/vpn-router/generated.nft
        exec sleep infinity
    volumes:
      - ./base-nat.nft:/etc/vpn-router/base-nat.nft:ro
      - ${VPN_ROUTER_LAB_NFTABLES_CONFIG:?Render the lab nftables config first}:/etc/vpn-router/generated.nft:ro
    networks:
      lab:
        ipv4_address: 172.30.20.10
    healthcheck:
      test: ["CMD-SHELL", "nft list table inet vpn_router_lab >/dev/null 2>&1 && ip netns exec canary-client ip route show default >/dev/null 2>&1 && ip netns exec control-client ip route show default >/dev/null 2>&1"]
      interval: 1s
      timeout: 1s
      retries: 90

  sidecar:
    image: ghcr.io/sagernet/sing-box:v1.13.12@sha256:da0e2331395c9025a85fa58892772b4cdbe5f2e530e93defeec3968175d06c6d
    network_mode: service:source
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["-C", "/etc/sing-box", "run"]
    volumes:
      - ${VPN_ROUTER_LAB_SING_BOX_CONFIG:?Render the lab sing-box config first}:/etc/sing-box/config.json:ro
    depends_on:
      source:
        condition: service_healthy
      socks-egress:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':3039 ' /proc/net/tcp || grep -q ':3039 ' /proc/net/tcp6"]
      interval: 1s
      timeout: 1s
      retries: 30

  dns:
    build:
      context: ../../deploy/dnsmasq
    image: vpn-router-dns:lab
    network_mode: service:source
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    command: ["--keep-in-foreground", "--conf-file=/etc/dnsmasq.conf"]
    volumes:
      - ${VPN_ROUTER_LAB_DNSMASQ_CONFIG:?Render the lab dnsmasq config first}:/etc/dnsmasq.conf:ro
      - ./resolv.conf:/etc/resolv.conf:ro
    depends_on:
      source:
        condition: service_healthy
      upstream-dns:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':14E9 ' /proc/net/udp || grep -q ':14E9 ' /proc/net/udp6"]
      interval: 1s
      timeout: 1s
      retries: 30

  upstream-dns:
    build:
      context: ../../deploy/dnsmasq
    image: vpn-router-dns:lab
    command: ["--keep-in-foreground", "--conf-file=/etc/dnsmasq.conf"]
    volumes:
      - ./upstream-dnsmasq.conf:/etc/dnsmasq.conf:ro
    networks:
      lab:
        ipv4_address: 172.30.20.50
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':0035 ' /proc/net/udp || grep -q ':0035 ' /proc/net/udp6"]
      interval: 1s
      timeout: 1s
      retries: 30

  socks-egress:
    image: ghcr.io/sagernet/sing-box:v1.13.12@sha256:da0e2331395c9025a85fa58892772b4cdbe5f2e530e93defeec3968175d06c6d
    command: ["-C", "/etc/sing-box", "run"]
    volumes:
      - ./socks-egress.json:/etc/sing-box/config.json:ro
    networks:
      lab:
        ipv4_address: 172.30.20.40
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':0438 ' /proc/net/tcp || grep -q ':0438 ' /proc/net/tcp6"]
      interval: 1s
      timeout: 1s
      retries: 30

  strict-target:
    image: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
    command:
      - /bin/sh
      - -ec
      - |
        while true; do
          printf 'HTTP/1.1 200 OK\r\nContent-Length: 14\r\nConnection: close\r\n\r\nstrict-target\n' | nc -l -p 18080
        done
    networks:
      lab:
        ipv4_address: 172.30.20.20

  direct-target:
    image: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
    command:
      - /bin/sh
      - -ec
      - |
        while true; do
          printf 'HTTP/1.1 200 OK\r\nContent-Length: 14\r\nConnection: close\r\n\r\ndirect-target\n' | nc -l -p 18080
        done
    networks:
      lab:
        ipv4_address: 172.30.20.30

networks:
  lab:
    ipam:
      config:
        - subnet: 172.30.20.0/24

schema_version: "2.0"

sources:
  - tag: host-vpn
    type: tunnel_interface
    namespace: host
    interface: vpr-in
    clients:
      mode: address_list
      addresses: [10.55.0.2/32]
  - tag: proxy-vpn
    type: container_egress
    container_name: vpr-proxy-source
    clients:
      mode: all

capture:
  type: redirect
  listen_port: 15001

egresses:
  - tag: strict-egress
    type: socks5
    server: 172.29.55.2
    port: 1080
    healthcheck_url: https://example.com/
  - tag: direct
    type: direct

policies:
  - tag: strict-target
    sources: [host-vpn, proxy-vpn]
    destination_sets: [strict-target]
    egress: strict-egress
    failure_mode: block
  - tag: default-direct
    sources: [host-vpn, proxy-vpn]
    destination_sets: [default]
    egress: direct
    failure_mode: direct

destination_sets:
  strict-target:
    ip_cidrs: [192.0.2.20/32]

traffic_handling:
  udp_quic: reject
  ipv6: reject
  dns_mode: managed

resources:
  nftables_table: vpr_host_lab
  service_name: vpr-host-lab

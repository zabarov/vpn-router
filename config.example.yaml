schema_version: "3.0"

routing_data:
  country_provider:
    type: ripestat
    refresh_interval: 24h
    max_stale: 7d
  domain_resolver:
    refresh_interval: 5m
    min_ttl: 60
    max_ttl: 3600
    max_stale: 24h

sources:
  - tag: amnezia-in
    type: tunnel_interface
    namespace: container
    container_name: amnezia-awg2
    interface: awg0
    # Use address_list for a staged rollout or subnet for the whole VPN pool.
    clients:
      mode: subnet
      subnet: 10.8.1.0/24
  - tag: xray-in
    type: container_egress
    container_name: amnezia-xray
    clients:
      mode: all

capture:
  type: redirect
  listen_port: 12345

egresses:
  - tag: direct
    type: direct
  - tag: strict-egress
    type: tailscale_socks
    auth_key_env: VPN_ROUTER_TAILSCALE_AUTH_KEY
    exit_node: exit-node.example.ts.net
    proxy_server: vpn-router-egress
    proxy_port: 1055
    healthcheck_url: https://example.com/

policies:
  # Rules are evaluated from top to bottom.
  - tag: always-direct
    sources: [amnezia-in, xray-in]
    destination_sets:
      - direct-overrides
    egress: direct
    failure_mode: direct
  - tag: regional
    sources: [amnezia-in, xray-in]
    destination_sets:
      - regional
    egress: strict-egress
    failure_mode: block
  - tag: default-direct
    sources: [amnezia-in, xray-in]
    destination_sets:
      - default
    egress: direct
    failure_mode: direct

destination_sets:
  regional:
    country_codes:
      - RU
    exact_domains:
      - obr.site
      - 2ip.io
    domain_suffixes:
      - .ru
      - .xn--p1ai
      - .su
    ip_cidrs: []
  direct-overrides:
    exact_domains: []
    ip_cidrs:
      - 198.51.100.0/24

traffic_handling:
  udp_quic: reject
  ipv6: reject
  dns_mode: managed

resources:
  nftables_table: vpn_router
  service_name: vpn-router
